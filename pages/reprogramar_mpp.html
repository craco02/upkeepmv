<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" href="../img/Logo.png" type="image/png" sizes="32x32">
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <header>
            <nav class="nav-bar" aria-label="Navegación principal">
                <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="nav-menu-wrap">
                    <ul class="list-bar">
                        <li><a href="../index.html">Inicio</a></li>
                        <li><a href="../index.html#solicitudes">Solicitudes</a></li>
                        <li><a href="../index.html#mpp">MPP</a></li>
                        <li><a href="../index.html#informaciones">Informaciones</a></li>
                        <li><a href="../index.html#form-adds">Formularios</a></li>
                        <li><a href="../index.html#otros">Otros</a></li>
                        <li><a href="../index.html#contacto">Contacto</a></li>
                    </ul>
                    <div id="nav-login"></div>
                </div>
            </nav>
            <div class="banner">
            <div class="logo"><img height="150" width="150" src="../img/Logo.png" alt="logo metalurgica vera"></div>
            <div class="hero">
                <h1>Mantenimiento Metalúrgica Vera S.R.L.</h1>
                <p>Garantizamos la confiabilidad, disponibilidad y eficiencia de los equipos e instalaciones industriales.</p>
            </div>
            </div>  
            <div id="loginModal" class="login-modal">
                <div class="login-modal-content">
                    <span id="closeLoginModal" class="login-close">&times;</span>
                    <h2>Inicio de Sesión</h2>
                    <form id="loginForm">
                        <label for="user">Usuario:</label>
                        <input type="text" id="user" name="user" required>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                        <button type="submit">Enviar</button>
                    </form>
                    <div id="loginMensaje"></div>
                </div>
            </div>
            <script src="../js/api-config.js"></script>
            <script src="../js/login-modal.js"></script>
            <script src="../js/nav-responsive.js"></script>
        </header>

        <!--<hr>-->

            <main class="solicitud">
                <div class="titulo"><h2>Cierre de Solicitud de Mantenimiento</h2></div>
                <form id="formReprogramarMPP" action="/api/mantenimientos-preventivos/reprogramacion" method="post">
                    <div>
                        <label for="maquina">Mantenimiento</label>
                        <select id="maquina" name="id" required></select>
                    </div>
                

                    <div>
                        <label for="fecha_rep">Seleccione la fecha de reprogramación:</label>
                        <input type="date" id="fecha_rep" name="reprogramacion_inicio" required style="width: 100%; max-width: 240px; padding: 0.7rem 0.9rem; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; background: #fff;">
                    </div>

                    <button type="submit">Reprogramar Mantenimiento</button>
                </form>

                <script src="../js/mpp-alert.js"></script>
                <script src="../js/mantenimientos-preventivos-select.js"></script>
                <script>
                  document.addEventListener('DOMContentLoaded', () => {
                    const form = document.getElementById('formReprogramarMPP');
                    if (!form) return;
                    form.addEventListener('submit', async (event) => {
                      event.preventDefault();
                      const payload = {
                        id: document.getElementById('maquina')?.value,
                        reprogramacion_inicio: document.getElementById('fecha_rep')?.value
                      };

                      try {
                        const response = await API_FETCH('/api/mantenimientos-preventivos/reprogramacion', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify(payload)
                        });
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) throw new Error(data.error || data.detalle || 'No se pudo reprogramar');
                        window.mostrarMensajeMPP?.({
                          titulo: 'Reprogramación exitosa',
                          texto: 'La reprogramación del mantenimiento se guardó correctamente.',
                          redirigir: true,
                          destino: './vista_mpp.html'
                        });
                        form.reset();
                      } catch (error) {
                        console.error(error);
                        window.mostrarMensajeMPP?.({
                          titulo: 'Error',
                          texto: error.message || 'Error al reprogramar el mantenimiento',
                          redirigir: true,
                          destino: './vista_mpp.html'
                        });
                      }
                    });
                  });
                </script>

            </main>
    </body>
</html>
