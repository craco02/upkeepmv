        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <header>
            <nav class="nav-bar" aria-label="Navegación principal">
                <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="nav-menu-wrap">
                    <ul class="list-bar">
                        <li><a href="../index.html">Inicio</a></li>
                        <li><a href="../index.html#solicitudes">Solicitudes</a></li>
                        <li><a href="../index.html#mpp">MPP</a></li>
                        <li><a href="../index.html#informaciones">Informaciones</a></li>
                        <li><a href="../index.html#form-adds">Formularios</a></li>
                        <li><a href="../index.html#otros">Otros</a></li>
                        <li><a href="../index.html#contacto">Contacto</a></li>
                    </ul>
                    <div id="nav-login"></div>
                </div>
            </nav>
            <div class="banner">
            <div class="logo"><img height="150" width="150" src="../img/Logo.png" alt="logo metalurgica vera"></div>
            <div class="hero">
                <h1>Mantenimiento Metalúrgica Vera S.R.L.</h1>
                <p>Garantizamos la confiabilidad, disponibilidad y eficiencia de los equipos e instalaciones industriales.</p>
            </div>
            </div>  
            <div id="loginModal" class="login-modal">
                <div class="login-modal-content">
                    <span id="closeLoginModal" class="login-close">&times;</span>
                    <h2>Inicio de Sesión</h2>
                    <form id="loginForm">
                        <label for="user">Usuario:</label>
                        <input type="text" id="user" name="user" required>
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>

                </div>
            </div>
            <script src="../js/api-config.js"></script>
            <script src="../js/login-modal.js"></script>
            <script src="../js/nav-responsive.js"></script>
        </header>

        <!--<hr>-->

            <main class="solicitud">
                <div class="titulo"><h2>Asignación de Mantenimiento Preventivo</h2></div>
                <form id="formAsignarMPP" action="/api/mantenimientos-preventivos/asignacion" method="post">
                    <div>
                        <label for="maquina">Mantenimiento</label>
                        <select id="maquina" name="id" required></select>
                    </div>
                    <!-- Párrafo dinámico para mostrar la avería -->
                    <p id="info-averia" class="info-averia"></p>

                    <div>
                        <label for="responsable">Responsable</label>
                        <select id="responsable" name="responsable" required>
                        <option value="">Asignar técnico</option>   
                        <option value="Santiago Rodríguez">Santiago Rodríguez</option>
                        <option value="Mauricio Patiño">Mauricio Patiño</option>
                        <option value="Ángel Lezcano">Ángel Lezcano</option>
                        <option value="Adriano Verón">Adriano Verón</option>
                        <option value="Aldo Ibarrola">Aldo Ibarrola</option>
                        <option value="Blas Giménez">Blas Giménez</option>
                        <option value="Cristhian Redes">Cristhian Redes</option>
                        <option value="Gustavo González">Gustavo González</option>
                        <option value="Edgar Ledezma">Edgar Ledezma</option>
                        <option value="Cristino Mora">Cristino Mora</option>
                        <option value="Ronaldo Cáceres">Ronaldo Cáceres</option>
                        <option value="Alvaro Lovera">Alvaro Lovera</option>
                        </select>
                    </div>
                    <!-- Campo de texto (Apoyo) -->
                    <div>
                        <label for="apoyo">Apoyo</label>
                        <select id="apoyo" name="apoyos">
                        <option value="">Sin apoyo</option>   
                        <option value="Santiago Rodríguez">Santiago Rodríguez</option>
                        <option value="Mauricio Patiño">Mauricio Patiño</option>
                        <option value="Ángel Lezcano">Ángel Lezcano</option>
                        <option value="Adriano Verón">Adriano Verón</option>
                        <option value="Aldo Ibarrola">Aldo Ibarrola</option>
                        <option value="Blas Giménez">Blas Giménez</option>
                        <option value="Cristhian Redes">Cristhian Redes</option>
                        <option value="Gustavo González">Gustavo González</option>
                        <option value="Edgar Ledezma">Edgar Ledezma</option>
                        <option value="Cristino Mora">Cristino Mora</option>
                        <option value="Ronaldo Cáceres">Ronaldo Cáceres</option>
                        <option value="Alvaro Lovera">Alvaro Lovera</option>
                        </select>
                    </div>

                    <button type="submit">Asignar Técnico</button>
                </form>

                <script src="../js/mpp-alert.js"></script>
                <script src="../js/mantenimientos-preventivos-select.js"></script>
                <script>
                  document.addEventListener('DOMContentLoaded', () => {
                    const form = document.getElementById('formAsignarMPP');
                    if (!form) return;
                    form.addEventListener('submit', async (event) => {
                      event.preventDefault();
                      const payload = {
                        id: document.getElementById('maquina')?.value,
                        responsable: document.getElementById('responsable')?.value || '',
                        apoyos: document.getElementById('apoyo')?.value || ''
                      };

                      try {
                        const response = await API_FETCH('/api/mantenimientos-preventivos/asignacion', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify(payload)
                        });
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok) throw new Error(data.error || data.detalle || 'No se pudo asignar');
                        window.mostrarMensajeMPP?.({
                          titulo: 'Asignación exitosa',
                          texto: 'El mantenimiento preventivo fue asignado correctamente.',
                          redirigir: true,
                          destino: './vista_mpp.html'
                        });
                        form.reset();
                      } catch (error) {
                        console.error(error);
                        window.mostrarMensajeMPP?.({
                          titulo: 'Error',
                          texto: error.message || 'Error al asignar el mantenimiento',
                          redirigir: true,
                          destino: './vista_mpp.html'
                        });
                      }
                    });
                  });
                </script>

            </main>
    </body>
</html>
